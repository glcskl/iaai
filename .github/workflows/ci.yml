name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff (syntax and undefined names)
        run: ruff check --select E9,F63,F7,F82 .

      - name: Bytecode compile (smoke)
        run: python -m compileall -q .
